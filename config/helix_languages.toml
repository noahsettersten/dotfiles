# Discussion for new tsc LSP:
# https://github.com/helix-editor/helix/pull/16026
# https://github.com/helix-editor/helix/issues/15134#issuecomment-4937274016

# --Add ESLint and Prettier formatting for JS/JSX/TS/TSX--
[[language]]
name = "javascript"
language-servers = ["typescript-language-server", "vscode-eslint-language-server"]
# formatter = { command = 'devbox', args = ["run", "yarn", "prettier", "--parser", "typescript", "--stdin-filepath", "stdin.js"] }
formatter = { command = 'yarn', args = ["prettier", "--parser", "typescript", "--stdin-filepath", "stdin.js"] }
auto-format = true

[[language]]
name = "jsx"
language-servers = ["typescript-language-server", "vscode-eslint-language-server"]
# formatter = { command = 'devbox', args = ["run", "yarn", "prettier", "--parser", "typescript", "--stdin-filepath", "stdin.jsx"] }
formatter = { command = 'yarn', args = ["prettier", "--parser", "typescript", "--stdin-filepath", "stdin.jsx"] }
auto-format = true

[[language]]
name = "typescript"
language-servers = ["typescript-language-server", "vscode-eslint-language-server"]
# formatter = { command = 'devbox', args = ["run", "yarn", "prettier", "--parser", "typescript", "--stdin-filepath", "stdin.ts"] }
formatter = { command = 'yarn', args = ["prettier", "--parser", "typescript", "--stdin-filepath", "stdin.ts"] }
auto-format = true

[[language]]
name = "tsx"
language-servers = ["typescript-language-server", "vscode-eslint-language-server"]
# formatter = { command = 'devbox', args = ["run", "yarn", "prettier", "--parser", "typescript", "--stdin-filepath", "stdin.tsx"] }
formatter = { command = 'yarn', args = ["prettier", "--parser", "typescript", "--stdin-filepath", "stdin.tsx"] }
auto-format = true

[language-server.rubocop]
command = "bundle"
args = ["exec", "rubocop", "--lsp"]

# --Add RuboCop for Ruby--
[[language]]
name = "ruby"
language-servers = [ { name = "ruby-lsp", except-features=["diagnostics"] }, { name = "rubocop", only-features=["diagnostics"] } ]
formatter = { command = "bundle", args = ["exec", "stree", "format", "--print-width=100", "--plugins=plugin/trailing_comma"] }
auto-format = true

# --Add Herb for ERB--
[language-server.herb]
command = "yarn"
args = ["exec", "herb-language-server", "--", "--stdio"]
formatter = { command = "yarn", args = ["dlx", "@herb-tools/formatter", "--force"] }

[[language]]
name = "erb"
language-servers = ["herb"]
file-types = ["erb", "html.erb"]
roots = ["Gemfile", "package.json"]

# --Add other configs to Bash filetype--
[[language]]
name = "bash"
file-types = [{ glob = ".tmux.conf" }, {glob="yabairc"},{glob="skhdrc"}]
