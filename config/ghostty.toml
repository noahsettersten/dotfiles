#  -- Foundation -- (Cmd+Shift+comma to reload config)
command = /opt/homebrew/bin/fish
shell-integration = fish

## -- Theme -- (other light options: catppuccin-latte, alabaster, pencillight)
theme = dark:catppuccin-macchiato,light:rose-pine-dawn 

## -- Font -- (Fallback needed starting 8/26/2026 for Ghostty)
font-family = JetBrains Mono

font-family = Mononoki Nerd Font
